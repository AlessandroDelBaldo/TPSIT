<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice SOAP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Calcolatrice SOAP</h1>
        <p>Web Service &mdash; <code>dneonline.com/calculator.asmx</code></p>
    </header>

    <main>
        <div class="card">

            <form id="calc-form">

                <div class="input-row">
                    <div class="form-group">
                        <label for="numA">Primo operando</label>
                        <input type="number" id="numA" name="numA" value="0" required>
                    </div>

                    <div class="form-group">
                        <label for="operazione">Operazione</label>
                        <select id="operazione" name="operazione">
                            <option value="Add">+ Addizione</option>
                            <option value="Subtract">− Sottrazione</option>
                            <option value="Multiply">× Moltiplicazione</option>
                            <option value="Divide">÷ Divisione</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="numB">Secondo operando</label>
                        <input type="number" id="numB" name="numB" value="0" required>
                    </div>
                </div>

                <button type="submit" id="calc-btn">Calcola</button>

            </form>

            <!-- Area risultato -->
            <div id="result-box" class="result-box hidden">
                <span class="result-label">Risultato</span>
                <span id="result-value" class="result-value"></span>
            </div>

            <p id="error-msg" class="error-msg hidden"></p>

        </div>
    </main>

    <footer>
        <p>Client-Server con SOAP &mdash; TPSIT</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
