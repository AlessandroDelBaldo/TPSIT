<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoUsate - Concessionaria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>AutoUsate</h1>
            <p>La tua concessionaria di fiducia</p>
        </div>
    </header>

    <main>

        <!-- Form di ricerca -->
        <section class="search-section">
            <h2>Cerca la tua auto</h2>
            <form id="search-form">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="brand">Marca</label>
                        <select id="brand" name="brand">
                            <option value="">Tutte le marche</option>
                            <option value="Fiat">Fiat</option>
                            <option value="Ford">Ford</option>
                            <option value="Audi">Audi</option>
                            <option value="Volkswagen">Volkswagen</option>
                            <option value="BMW">BMW</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Renault">Renault</option>
                            <option value="Peugeot">Peugeot</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="model">Modello</label>
                        <input type="text" id="model" name="model" placeholder="es. 500, Golf, A3...">
                    </div>

                    <div class="form-group">
                        <label for="fuel_type">Alimentazione</label>
                        <select id="fuel_type" name="fuel_type">
                            <option value="">Tutte</option>
                            <option value="benzina">Benzina</option>
                            <option value="diesel">Diesel</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="color">Colore</label>
                        <input type="text" id="color" name="color" placeholder="es. rosso, blu, bianco...">
                    </div>

                </div>
                <button type="submit" id="search-btn">Cerca Auto</button>
            </form>
        </section>

        <!-- Tabella risultati (popolata via JavaScript) -->
        <section class="results-section">
            <h2>Risultati</h2>
            <p id="results-count"></p>
            <div class="table-wrapper">
                <table id="cars-table">
                    <thead>
                        <tr>
                            <th>Immagine</th>
                            <th>Marca</th>
                            <th>Modello</th>
                            <th>Alimentazione</th>
                            <th>Colore</th>
                        </tr>
                    </thead>
                    <tbody id="cars-tbody">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2024 AutoUsate Concessionaria &mdash; TPSIT</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
